<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strezless Metadata App</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 20px auto; padding: 15px; background: #f4f4f9; color: #333; }
        h1, h2 { text-align: center; color: #2c3e50; }
        
        /* Form Styles */
        .form-container { background: white; padding: 20px; margin-bottom: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-left: 5px solid #3498db; }
        input, select { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; }
        button:hover { background: #2980b9; }
        .message { text-align: center; margin-top: 10px; font-weight: bold; color: green; display: none; }

        /* Track Card Styles */
        .track-card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-left: 5px solid #e67e22; }
        .track-card h3 { margin: 0 0 10px 0; color: #e67e22; }
        .track-card p { margin: 5px 0; font-size: 15px; }
        .label { font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <h1>🎵 Strezless Metadata</h1>

    <!-- ADD TRACK FORM -->
    <div class="form-container">
        <h2>Add New Track</h2>
        <form id="trackForm">
            <input type="text" id="trackTitle" placeholder="Track Title" required>
            <input type="text" id="artistName" placeholder="Artist Name" required>
            <input type="text" id="albumTitle" placeholder="Album Title">
            <input type="date" id="releaseDate" placeholder="Release Date">
            <input type="text" id="isrc" placeholder="ISRC (e.g., US1234567890)">
            <input type="text" id="genre" placeholder="Genre">
            <button type="submit">Save Track Metadata</button>
            <p id="successMsg" class="message">Track saved successfully!</p>
        </form>
    </div>

    <!-- TRACKS LIST -->
    <h2>Your Catalog</h2>
    <div id="tracks-container">Loading tracks...</div>

    <script>
        // Function to load and display tracks
        function loadTracks() {
            fetch('/api/tracks')
                .then(response => response.json())
                .then(tracks => {
                    const container = document.getElementById('tracks-container');
                    container.innerHTML = ''; 
                    
                    if (tracks.length === 0) {
                        container.innerHTML = '<p style="text-align:center;">No tracks found yet.</p>';
                        return;
                    }

                    // Show newest tracks first
                    tracks.reverse().forEach(track => {
                        const card = document.createElement('div');
                        card.className = 'track-card';
                        card.innerHTML = `
                            <h3>${track.trackTitle}</h3>
                            <p><span class="label">Artist:</span> ${track.artistName}</p>
                            <p><span class="label">Album:</span> ${track.albumTitle || 'N/A'}</p>
                            <p><span class="label">ISRC:</span> ${track.isrc || 'Pending'}</p>
                            <p><span class="label">Release Date:</span> ${track.releaseDate || 'Pending'}</p>
                            <p><span class="label">Genre:</span> ${track.genre || 'N/A'}</p>
                        `;
                        container.appendChild(card);
                    });
                });
        }

        // Handle form submission
        document.getElementById('trackForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Stop page from reloading

            const newTrack = {
                trackTitle: document.getElementById('trackTitle').value,
                artistName: document.getElementById('artistName').value,
                albumTitle: document.getElementById('albumTitle').value,
                releaseDate: document.getElementById('releaseDate').value,
                isrc: document.getElementById('isrc').value,
                genre: document.getElementById('genre').value
            };

            // Send to our API
            fetch('/api/tracks', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newTrack)
            })
            .then(response => response.json())
            .then(data => {
                // Show success message
                document.getElementById('successMsg').style.display = 'block';
                setTimeout(() => document.getElementById('successMsg').style.display = 'none', 3000);
                
                // Clear the form
                document.getElementById('trackForm').reset();
                
                // Reload the track list
                loadTracks();
            });
        });

        // Load tracks when the page first opens
        loadTracks();
    </script>
</body>
</html>
