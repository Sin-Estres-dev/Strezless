<!DOCTYPE html><html><head><title>Strezless Nexus</title></head><body>
<h1>Strezless Nexus for Music Metadata</h1>
<a href="/api/export">Download CSV Export</a><hr>
<h2>Tracks</h2><div id="tracks"></div><hr>
<h2>Add / Edit Track</h2>
<form id="trackForm">
Title*: <input id="trackTitle" required><br>
Artist*: <input id="artistName" required><br>
Album: <input id="albumTitle"><br>
ISRC: <input id="isrc"><br>
ISWC: <input id="iswc"><br>
Label: <input id="labelName" value="Strezless Musick Productionz"><br>
Master Owner: <input id="masterOwner"><br>
Publishing Owner: <input id="publishingOwner"><br>
License: <select id="licenseType"><option>All Rights Reserved</option><option>Sync Licensing Available</option><option>Non-Exclusive Lease</option><option>Exclusive Rights Sold</option></select><br>
Usage Terms: <input id="usageTerms"><br>
AI Disclosure: <select id="aiDisclosure"><option value="none">No AI</option><option value="ai-assisted">AI-Assisted</option><option value="ai-generated">AI-Generated</option></select><br>
<button type="submit">Save Track</button>
</form><hr>
<h2>Contributors</h2>
<form id="contribForm">Name*: <input id="cName" required> Role: <input id="cRole"><button type="submit">Add</button></form>
<div id="contribs"></div>
<script>
function loadTracks(){fetch('/api/tracks').then(r=>r.json()).then(t=>{document.getElementById('tracks').innerHTML=t.map(x=>`<div><b>${x.trackTitle}</b> - ${x.artistName} | ${x.isrc||'No ISRC'} | ${x.licenseType} <button onclick="edit('${x.id}')">Edit</button> <button onclick="del('${x.id}')">Delete</button></div>`).join('')})}
function edit(id){fetch(`/api/tracks/${id}`).then(r=>r.json()).then(x=>{trackTitle.value=x.trackTitle;artistName.value=x.artistName;albumTitle.value=x.albumTitle||'';isrc.value=x.isrc||'';iswc.value=x.iswc||'';labelName.value=x.labelName||'';masterOwner.value=x.masterOwner||'';publishingOwner.value=x.publishingOwner||'';licenseType.value=x.licenseType||'All Rights Reserved';usageTerms.value=x.usageTerms||'';aiDisclosure.value=x.aiDisclosure||'none';window.editingId=id})}
function del(id){if(confirm('Delete?'))fetch(`/api/tracks/${id}`,{method:'DELETE'}).then(loadTracks)}
trackForm.onsubmit=e=>{e.preventDefault();let d={trackTitle:trackTitle.value,artistName:artistName.value,albumTitle:albumTitle.value,isrc:isrc.value.toUpperCase(),iswc:iswc.value.toUpperCase(),labelName:labelName.value,masterOwner:masterOwner.value,publishingOwner:publishingOwner.value,licenseType:licenseType.value,usageTerms:usageTerms.value,aiDisclosure:aiDisclosure.value};fetch(window.editingId?`/api/tracks/${window.editingId}`:'/api/tracks',{method:window.editingId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(()=>{trackForm.reset();window.editingId=null;loadTracks()})};
contribForm.onsubmit=e=>{e.preventDefault();fetch('/api/contributors',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:cName.value,role:cRole.value})}).then(()=>{contribForm.reset();loadContribs()})};
function loadContribs(){fetch('/api/contributors').then(r=>r.json()).then(c=>{document.getElementById('contribs').innerHTML=c.map(x=>`<div>${x.name} - ${x.role||''} <button onclick="fetch('/api/contributors/${x.id}',{method:'DELETE'}).then(loadContribs)">Del</button></div>`).join('')})}
loadTracks();loadContribs();
</script></body></html>
